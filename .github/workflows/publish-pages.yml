name: Publish template overview to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '*.eln'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Prepare site
        run: |
          mkdir -p _site
          cp .github/templates/index.html _site/index.html

      - name: Generate data
        run: sh .github/scripts/generate-data.sh _site/data.js

      - name: Validate site
        run: |
          test -f _site/index.html
          test -f _site/data.js
          find _site -type f

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
